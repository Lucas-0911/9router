name: Rust desktop installers

on:
  workflow_dispatch:
  push:
    branches: ["feat/rust-desktop"]
    tags: ["desktop-v*"]
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/rust-desktop.yml"

permissions:
  contents: read

concurrency:
  group: rust-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.platform }} installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
          - platform: windows
            os: windows-latest
          - platform: linux
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop -> target"
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev patchelf
      - name: Check native backend and UI
        working-directory: desktop
        run: |
          cargo test --locked
          node scripts/check-ui.mjs
      - name: Build macOS DMG
        if: runner.os == 'macOS'
        run: bash desktop/scripts/package-macos.sh
      - name: Build Windows EXE installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./desktop/scripts/package-windows.ps1
      - name: Build Linux DEB
        if: runner.os == 'Linux'
        run: bash desktop/scripts/package-linux.sh
      - name: Upload native installer
        uses: actions/upload-artifact@v4
        with:
          name: 9router-${{ matrix.platform }}-${{ runner.arch }}
          if-no-files-found: error
          path: |
            desktop/target/release/bundle/dmg/*.dmg
            desktop/target/release/bundle/nsis/*.exe
            desktop/target/release/bundle/deb/*.deb
