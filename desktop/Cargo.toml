[package]
name = "nine-router-core"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Native Rust backend migration for 9Router"

[dependencies]
axum = "0.8.9"
futures-util = "0.3.34"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json", "stream"] }
rusqlite = { version = "0.40.2", features = ["backup", "bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "net", "signal", "sync", "time", "macros"] }
uuid = { version = "1.28.0", features = ["v4"] }
tauri = { version = "2.12.3", optional = true , features = [] }

[features]
desktop-app = ["dep:tauri", "tauri/custom-protocol", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "2.7.2", optional = true , features = [] }

[[bin]]
name = "nine-router"
path = "src/main.rs"
